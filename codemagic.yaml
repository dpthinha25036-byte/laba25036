workflows:
  macos-machine:
    name: macOS Machine
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest

    scripts:
      - name: Check Mac and keep session alive
        script: |
          echo "===== macOS ====="
          sw_vers

          echo "===== Storage ====="
          df -h

          echo "===== Hardware ====="
          system_profiler SPHardwareDataType

          echo "===== Remote session ====="
          echo "Mac is ready for SSH/VNC"
          echo "Keeping machine alive for 120 minutes..."

          sleep 7200
