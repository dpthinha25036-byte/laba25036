workflows:
  macos-machine:
    name: macOS Machine
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Check Mac
        script: |
          echo "===== macOS ====="
          sw_vers
          echo "===== Storage ====="
          df -h
          echo "===== Hardware ====="
          system_profiler SPHardwareDataType
